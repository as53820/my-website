<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Othello</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #f0f2f5; --green: #2e7d32; --accent: #007bff; }
        body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        #setup-screen { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .id-display { font-size: 2.5rem; font-weight: bold; color: var(--accent); margin: 10px 0; letter-spacing: 4px; }
        .otp-container { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
        .otp-input { width: 40px; height: 50px; font-size: 1.5rem; text-align: center; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        button { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #game-screen { display: none; width: 100%; max-width: 500px; }
        #info-panel { background: white; padding: 10px 20px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); background: var(--green); border: 4px solid #1b5e20; border-radius: 8px; width: 90vw; height: 90vw; max-width: 500px; max-height: 500px; }
        .cell { border: 0.5px solid rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; }
        .stone { width: 85%; height: 85%; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: transform 0.4s; }
        .black { background: #111; }
        .white { background: #fff; transform: rotateY(180deg); }
        .hint { width: 30%; height: 30%; background: rgba(255,255,255,0.2); border-radius: 50%; }
        .error-log { color: red; font-size: 0.8rem; margin-top: 10px; text-align: left; background: #fff1f1; padding: 5px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div style="font-size: 0.9rem; color: #666;">あなたの部屋ID</div>
        <div id="my-id-text" class="id-display">------</div>
        <div class="otp-container" id="otp-parent">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
        </div>
        <button id="join-btn" onclick="joinRoom()">対戦を開始する</button>
        <div id="status-msg" style="margin-top:15px; font-size:0.85rem; color:#666;"></div>
        <div id="debug-log" class="error-log"></div>
    </div>

    <div id="game-screen">
        <div id="info-panel">
            <div id="turn-text">対戦相手を待っています...</div>
            <div id="score-text">黒 2 - 2 白</div>
        </div>
        <div id="board"></div>
    </div>

    <script>
        // 設定値
        const firebaseConfig = {
            apiKey: "AIzaSyDIM-ycgMAJpIZXXC0UpeeG-PXPM0ds54w",
            authDomain: "osello-b18cb.firebaseapp.com",
            // databaseURLを明示的に指定
            databaseURL: "https://osello-b18cb-default-rtdb.firebaseio.com", 
            projectId: "osello-b18cb",
            storageBucket: "osello-b18cb.firebasestorage.app",
            messagingSenderId: "521420510635",
            appId: "1:521420510635:web:236a09645635d99d00aeee"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let roomId, myColor = 0;
        const inputs = document.querySelectorAll('.otp-input');
        const joinBtn = document.getElementById('join-btn');
        const statusMsg = document.getElementById('status-msg');
        const debugLog = document.getElementById('debug-log');

        // 入力制御
        inputs.forEach((input, i) => {
            input.oninput = () => { if(input.value && i<5) inputs[i+1].focus(); };
            input.onkeydown = (e) => { if(e.key==='Backspace' && !input.value && i>0) inputs[i-1].focus(); };
        });

        const myGeneratedId = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('my-id-text').innerText = myGeneratedId;

        function joinRoom() {
            const inputId = Array.from(inputs).map(i => i.value).join('');
            roomId = inputId || myGeneratedId;
            myColor = inputId ? 2 : 1; 

            joinBtn.disabled = true;
            joinBtn.innerText = "接続中...";
            statusMsg.innerText = "Firebaseに接続して初期化中...";

            const ref = db.ref('rooms/' + roomId);

            // 接続試行
            ref.on('value', (s) => {
                const data = s.val();
                if (!data && myColor === 1) {
                    const board = Array(64).fill(0);
                    board[27]=2; board[28]=1; board[35]=1; board[36]=2;
                    ref.set({ board, turn: 1 }).then(() => {
                        console.log("Room Created");
                    }).catch(e => showError(e));
                } else if (data) {
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'block';
                    render(data.board, data.turn);
                }
            }, (err) => {
                showError(err);
            });
        }

        function showError(err) {
            debugLog.style.display = "block";
            debugLog.innerText = "エラー: " + err.message + "\nルール設定を確認してください。";
            joinBtn.disabled = false;
            joinBtn.innerText = "再試行";
        }

        function getFlips(board, idx, color) {
            if (board[idx] !== 0) return [];
            const opponent = 3 - color;
            const directions = [-9,-8,-7,-1,1,7,8,9];
            let allFlips = [];
            directions.forEach(d => {
                let temp = [], cur = idx + d;
                while(cur >= 0 && cur < 64) {
                    if (Math.abs((cur-d)%8 - cur%8) > 1) break;
                    if (board[cur] === opponent) temp.push(cur);
                    else if (board[cur] === color) { allFlips.push(...temp); break; }
                    else break;
                    cur += d;
                }
            });
            return allFlips;
        }

        function render(board, turn) {
            const bEl = document.getElementById('board');
            bEl.innerHTML = '';
            let b=0, w=0;
            board.forEach((v, i) => {
                if(v===1) b++; if(v===2) w++;
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (v !== 0) {
                    const stone = document.createElement('div');
                    stone.className = `stone ${v===1?'black':'white'}`;
                    cell.appendChild(stone);
                } else if (turn === myColor) {
                    const flips = getFlips(board, i, myColor);
                    if (flips.length > 0) {
                        const hint = document.createElement('div');
                        hint.className = 'hint';
                        cell.appendChild(hint);
                        cell.onclick = () => {
                            const newBoard = [...board];
                            newBoard[i] = myColor;
                            flips.forEach(f => newBoard[f] = myColor);
                            let nextTurn = 3 - myColor;
                            const hasMove = newBoard.some((_, idx) => getFlips(newBoard, idx, nextTurn).length > 0);
                            if (!hasMove) nextTurn = myColor; 
                            db.ref('rooms/' + roomId).update({ board: newBoard, turn: nextTurn });
                        };
                    }
                }
                bEl.appendChild(cell);
            });
            document.getElementById('score-text').innerText = `黒 ${b} - ${w} 白`;
            document.getElementById('turn-text').innerText = (turn === myColor) ? "あなたの番" : "相手の番";
        }
    </script>
</body>
</html>
