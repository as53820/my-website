<!DOCTYPE html>
<html lang="ja" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arch Linux x Kosen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#020205',
                            darker: '#000000',
                            neon: {
                                cyan: '#22d3ee',
                                pink: '#f472b6',
                                yellow: '#fde047',
                                blue: '#3b82f6',
                                green: '#4ade80',
                            },
                        },
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Base styles */
        body {
            background-color: #020205;
            color: #cbd5e1;
            /* slate-300 */
            font-family: 'JetBrains Mono', monospace;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 2px;
            margin: 0;
        }

        h1,
        h2,
        h3 {
            font-weight: 800;
            letter-spacing: -0.05em;
            color: #22d3ee;
            /* cyber-neon-cyan */
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }

        /* Components */
        .cyber-border {
            border: 1px solid rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
        }

        .terminal-box {
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.5);
            /* slate-700/50 */
            border-radius: 0.125rem;
            padding: 1rem;
            backdrop-filter: blur(4px);
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
            animation: glitch-anim2 1s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% {
                clip: rect(31px, 9999px, 94px, 0);
            }

            20% {
                clip: rect(62px, 9999px, 42px, 0);
            }

            40% {
                clip: rect(16px, 9999px, 78px, 0);
            }

            60% {
                clip: rect(11px, 9999px, 13px, 0);
            }

            80% {
                clip: rect(85px, 9999px, 72px, 0);
            }

            100% {
                clip: rect(45px, 9999px, 92px, 0);
            }
        }

        @keyframes glitch-anim2 {
            0% {
                clip: rect(65px, 9999px, 100px, 0);
            }

            20% {
                clip: rect(12px, 9999px, 56px, 0);
            }

            40% {
                clip: rect(34px, 9999px, 12px, 0);
            }

            60% {
                clip: rect(98px, 9999px, 23px, 0);
            }

            80% {
                clip: rect(45px, 9999px, 67px, 0);
            }

            100% {
                clip: rect(12px, 9999px, 89px, 0);
            }
        }
    </style>
    <meta name="description" content="Arch Linux | Kosen student. Minimalist portfolio.">
</head>

<body class="selection:bg-cyber-neon-cyan selection:text-cyber-black overflow-x-hidden">
    <!-- Scanlines and Overlay -->
    <div
        class="fixed inset-0 pointer-events-none z-50 bg-[radial-gradient(circle,transparent_0%,rgba(0,0,0,0.8)_100%)]">
    </div>

    <main class="relative z-10 max-w-4xl mx-auto px-6 py-24 md:py-48 space-y-32">

        <!-- Hero Section -->
        <header class="space-y-12 text-center md:text-left">
            <h1 class="text-6xl md:text-8xl font-black leading-none text-cyber-neon-cyan lowercase tracking-tighter">
                <span class="glitch-text" data-text="minimalist">minimalist</span>
            </h1>
            <p class="text-lg md:text-xl text-slate-500 font-bold italic">
                > kosen 1st yr // arch linux
            </p>

            <div class="flex flex-wrap justify-center md:justify-start gap-8 pt-4">
                <a href="#"
                    class="text-xs font-bold tracking-[0.4em] text-cyber-neon-pink hover:text-white transition-colors">
                    X / TWITTER
                </a>
                <div class="text-xs font-bold tracking-[0.4em] text-cyber-neon-cyan flex items-center gap-2">
                    <span class="opacity-50">DISCORD:</span> asas511
                </div>
                <a href="#"
                    class="text-xs font-bold tracking-[0.4em] text-slate-600 hover:text-cyber-neon-yellow transition-colors">
                    GITHUB
                </a>
            </div>
        </header>

        <!-- Ultra Minimal Terminal -->
        <section class="max-w-xs mx-auto md:mx-0 opacity-40 hover:opacity-100 transition-opacity">
            <div class="terminal-box border-none p-0">
                <div class="flex gap-4 items-center text-[10px] font-mono text-slate-600">
                    <span class="text-cyber-neon-pink">os</span> arch
                    <span class="text-cyber-neon-pink">env</span> hyprland
                    <span class="text-cyber-neon-pink">shell</span> zsh
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="pt-24 flex justify-center md:justify-start opacity-20">
            <div class="text-[8px] font-mono tracking-[0.5em] uppercase">
                i use arch btw.
            </div>
        </footer>

    </main>

    <script type="module" src="/main.js"></script>
</body>

</html>
