<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        /* 背景真っ暗、無駄な囲いなし */
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            /* ターミナル風フォント */
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* 名前・タイトル */
        h1 {
            font-size: 28px;
            color: #bf94ff;
            /* 明るい紫 */
            margin-bottom: 5px;
        }

        .status {
            color: #ffee58;
            /* 明るい黄色 */
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* プロフィールセクション */
        .info {
            margin-bottom: 40px;
        }

        .info div {
            margin: 10px 0;
            border-bottom: 1px solid #222;
            /* 控えめな区切り線 */
            padding-bottom: 5px;
        }

        .label {
            color: #ffee58;
            display: inline-block;
            width: 100px;
        }

        /* SNSセクション */
        .sns {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sns-item {
            text-decoration: none;
            color: #fff;
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
        }

        .sns-label {
            color: #bf94ff;
            font-weight: bold;
        }

        .sns-id {
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>About Me</h1>
        <div class="status">KOSEN Student / Dormitory</div>

        <div class="info">
            <div><span class="label">School</span>苫小牧高専</div>
            <div><span class="label">Birthday</span>[あなたの誕生日]</div>
        </div>

        <div class="sns">
            <div class="sns-item">
                <span class="sns-label">Discord</span>
                <span class="sns-id">[表示名]</span>
            </div>
            <div class="sns-item">
                <span class="sns-label">LINE</span>
                <span class="sns-id">[表示名]</span>
            </div>
            <div class="sns-item">
                <span class="sns-label">X</span>
                <span class="sns-id">[表示名]</span>
            </div>
        </div>
    </div>

</body>

</html>
