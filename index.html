<!DOCTYPE html>
<html lang="ja" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G83/KU | Arch Linux x Kosen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#0a0515',
                            darker: '#050209',
                            neon: {
                                cyan: '#22d3ee',
                                pink: '#f472b6',
                                yellow: '#fde047',
                                blue: '#3b82f6',
                                green: '#4ade80',
                            },
                        },
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./style.css">
    <meta name="description" content="Arch Linux | Kosen student. Minimalist cyberpunk portfolio.">
</head>

<body class="selection:bg-cyber-neon-cyan selection:text-cyber-black overflow-x-hidden">
    <!-- Scanlines and Overlay -->
    <div
        class="fixed inset-0 pointer-events-none z-50 bg-[radial-gradient(circle,transparent_0%,rgba(0,0,0,0.6)_100%)]">
    </div>

    <main class="relative z-10 max-w-4xl mx-auto px-6 py-16 md:py-32 space-y-32">

        <!-- Hero Section -->
        <header class="space-y-8 text-center md:text-left">
            <div
                class="inline-block px-3 py-1 bg-cyber-neon-pink/10 border border-cyber-neon-pink text-cyber-neon-pink text-[10px] font-bold tracking-[0.3em] mb-4 uppercase">
                Status: Minimalist Mode
            </div>
            <h1 class="text-6xl md:text-8xl font-black leading-none text-cyber-neon-cyan">
                <span class="glitch-text" data-text="G83/KU">G83/KU</span>
            </h1>
            <p class="text-xl md:text-2xl text-cyber-neon-pink font-bold italic opacity-80">
                > Kosen 1st Yr | Arch Linux
            </p>

            <div class="flex flex-wrap justify-center md:justify-start gap-6 pt-8">
                <a href="#" class="cyber-button flex items-center gap-2 group">
                    <span class="text-sm">X / TWITTER</span>
                </a>
                <a href="#"
                    class="cyber-button border-cyber-neon-pink text-cyber-neon-pink hover:shadow-[0_4px_20px_rgba(244,114,182,0.5)] flex items-center gap-2 group">
                    <span class="text-sm">DISCORD</span>
                </a>
                <a href="#" class="p-2 border border-slate-800 hover:border-cyber-neon-yellow transition-colors group"
                    title="GitHub">
                    <svg class="w-6 h-6 text-slate-500 group-hover:text-cyber-neon-yellow" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path

                    </svg>
                </a>
            </div>
        </header>

        <!-- Minimal Neofetch -->
        <section class="max-w-md mx-auto md:mx-0">
            <div class="terminal-box cyber-border border-cyber-neon-cyan/30">
                <div class="flex gap-1.5 mb-4 border-b border-slate-900 pb-2">
                    <div class="w-2 h-2 rounded-full bg-cyber-neon-cyan"></div>
                    <div class="text-[8px] text-slate-600 font-bold uppercase tracking-tighter">sys_info.log</div>
                </div>
                <div class="flex gap-6 items-center text-xs">
                    <pre class="text-cyber-neon-cyan font-bold opacity-50">
  /\
 /  \
/    \
      </pre>
                    <div class="space-y-1 font-mono text-slate-400">
                        <div><span class="text-cyber-neon-pink">OS:</span> Arch Linux</div>
                        <div><span class="text-cyber-neon-pink">ID:</span> Kosen 1st Yr</div>
                        <div><span class="text-cyber-neon-pink">ENV:</span> Hyprland / nvim</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Minimal Footer -->
        <footer
            class="pt-12 border-t border-slate-900 flex flex-col md:flex-row justify-between items-center gap-4 opacity-50">
            <div class="text-[10px] tracking-[0.4em] font-bold text-slate-500 uppercase">
                Minimalist Cyberpunk Framework
            </div>
            <div class="text-[10px] font-mono">
                &copy; 2026 G83/KU // <span class="text-cyber-neon-cyan">I use Arch btw.</span>
            </div>
        </footer>

    </main>

    <script type="module" src="/main.js"></script>
</body>

</html>
