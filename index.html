<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>AS5382 // Lab</title>
    <style>
        body {
            background-color: #ffffff;
            color: #222;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --------------------------------------------------
           紹介パネル：10秒間の拡大演出 + レスポンシブ
        -------------------------------------------------- */
        .profile {
            position: absolute;
            z-index: 10;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-right: 4px solid #ffd700;
            text-align: right;

            /* 初期状態：画面中央に拡大表示 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            width: 280px;

            /* 10秒後に右下へ移動するアニメーション */
            animation: moveToCorner 1s cubic-bezier(0.85, 0, 0.15, 1) forwards;
            animation-delay: 3s;
        }

        @keyframes moveToCorner {
            to {
                top: calc(100% - 30px);
                left: calc(100% - 30px);
                transform: translate(-100%, -100%) scale(1);
                width: 240px;
            }
        }

        .name {
            font-size: 1.4em;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: 800;
        }

        .desc {
            font-size: 0.85em;
            line-height: 1.6;
            color: #555;
        }

        .links {
            margin-top: 12px;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 10px;
        }

        .links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 12px;
            font-size: 0.8em;
            transition: 0.2s;
            font-weight: 700;
        }

        .links a:hover {
            color: #ffd700;
        }

        /* --------------------------------------------------
           スマホ対応 (Mobile)
        -------------------------------------------------- */
        @media (max-width: 600px) {
            .profile {
                width: 80%;
                text-align: center;
                border-right: none;
                border-bottom: 4px solid #ffd700;
            }

            @keyframes moveToCorner {
                to {
                    top: calc(100% - 20px);
                    left: 50%;
                    transform: translate(-50%, -100%) scale(0.9);
                    width: 90%;
                }
            }

            .links {
                text-align: center;
            }

            .links a {
                margin: 0 8px;
            }
        }
    </style>
</head>

<body>

    <div id="viewport">
    </div>

    <div class="profile">
        <div class="name">AS5382</div>
        <div class="desc">
            Arch Linux / KOSEN Student<br>
            i7-14700K / Tesla V100 Integration
        </div>
        <div class="links">
            <a href="https://github.com/as53820">GitHub</a>
            <a href="#">Discord</a>
            <a href="#">X</a>
        </div>
    </div>

</body>

</html>
