<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>as53820 Profile</title>
    <style>
        /* 背景は完全な黒、余白は広めにとる */
        body {
            background-color: #000;
            color: #d4d4d4;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            margin: 0;
            padding: 10vh 10vw;
            /* 画面中央に寄せる */
            letter-spacing: 0.05em;
        }

        /* ユーザー名：紫のアクセント */
        h1 {
            font-size: 1.8rem;
            color: #bd93f9;
            /* Dracula Purple */
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        /* サブタイトル：黄色のアクセント */
        .subtitle {
            color: #f1fa8c;
            /* Dracula Yellow */
            font-size: 0.9rem;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        /* 各セクション：囲いなし、左の縦線のみ */
        section {
            margin-bottom: 40px;
            border-left: 2px solid #444;
            padding-left: 20px;
        }

        .item {
            margin: 15px 0;
        }

        .label {
            color: #6272a4;
            /* 控えめな青灰色 */
            font-size: 0.75rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .value {
            font-size: 1.1rem;
            color: #f8f8f2;
        }

        /* SNS：装飾なし、テキストのみ */
        .sns-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sns-link {
            text-decoration: none;
            color: #f8f8f2;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 250px;
        }

        .sns-link:hover {
            color: #bd93f9;
        }

        /* 最後にさりげなくカーソルを点滅させる演出 */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2rem;
            background-color: #bd93f9;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>About Me<span class="cursor"></span></h1>
        <div class="subtitle">苫小牧高専 / 寮生</div>
    </header>

    <section>
        <div class="item">
            <span class="label">School</span>
            <span class="value">NIT, Tomakomai College</span>
        </div>
        <div class="item">
            <span class="label">Birthday</span>
            <span class="value">[誕生日を入力]</span>
        </div>
    </section>

    <section>
        <div class="sns-list">
            <div class="sns-link">
                <span style="color: #6272a4;">Discord</span>
                <span>[表示名]</span>
            </div>
            <div class="sns-link">
                <span style="color: #6272a4;">Line</span>
                <span>[表示名]</span>
            </div>
            <div class="sns-link">
                <span style="color: #6272a4;">X</span>
                <span>[表示名]</span>
            </div>
        </div>
    </section>

</body>

</html>
