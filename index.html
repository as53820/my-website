<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>AS53820 // Personal Terminal</title>
    <style>
        body {
            /* 深みのある暗い紫 */
            background-color: #0d0221;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* 画面にうっすら走査線のようなノイズを入れて「端末感」を出す */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 118, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        .box {
            border: 1px solid #4a148c;
            /* 紫の枠線 */
            padding: 40px;
            background: rgba(13, 2, 33, 0.8);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.2);
            text-align: center;
        }

        /* 独自の見出しスタイル：ネオンパープル */
        .tag {
            display: inline-block;
            background: #8a2be2;
            color: #fff;
            padding: 2px 12px;
            font-size: 0.9em;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 3px 3px 0px #4b0082;
        }

        .links a {
            display: block;
            color: #b388ff;
            text-decoration: none;
            margin: 8px 0;
            transition: 0.3s;
        }

        .links a:hover {
            color: #fff;
            text-shadow: 0 0 8px #8a2be2;
            padding-left: 10px;
        }

        .spec-text {
            font-size: 0.8em;
            color: #7e57c2;
            margin-top: 20px;
            border-top: 1px dashed #4a148c;
            padding-top: 10px;
        }

        /* キャラクターエリア：ただ並べるのではなく枠で囲む */
        .avatar-area {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            opacity: 0.7;
        }

        .avatar-area img {
            filter: sepia(1) saturate(2) hue-rotate(240deg);
            /* 紫っぽく加工 */
            width: 32px;
            transition: 0.5s;
        }

        .avatar-area img:hover {
            filter: none;
            opacity: 1;
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="tag">System Access</div>
        <div class="links">
            <a href="#">Discord (asas511)</a>
            <a href="#">X (Coming Soon)</a>
            <a href="#">LINE (asas511)</a>
            <a href="https://github.com/as53820">GitHub</a>
        </div>

        <div class="tag" style="background: #e91e63; box-shadow: 3px 3px 0px #880e4f; margin-top: 20px;">Archive</div>
        <div class="links">
            <a href="#">YT Downloader</a>
            <a href="#">Project: Physical AI</a>
        </div>

        <div class="spec-text">
            OS: Arch Linux | Hardware: i7-14700K / Tesla V100
        </div>

        <div class="avatar-area">
            <img src="https://via.placeholder.com/32/8a2be2/ffffff?text=1" alt="0">
            <img src="https://via.placeholder.com/32/8a2be2/ffffff?text=2" alt="1">
            <img src="https://via.placeholder.com/32/8a2be2/ffffff?text=3" alt="3">
            <img src="https://via.placeholder.com/32/8a2be2/ffffff?text=4" alt="5">
        </div>
    </div>
</body>

</html>あ
