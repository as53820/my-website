<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            margin: 0;
            padding: 10vh 8vw;
            line-height: 1.5;
        }

        h1 {
            font-size: 2.2rem;
            color: #bd93f9;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .cursor {
            display: inline-block;
            width: 12px;
            height: 1.8rem;
            background-color: #bd93f9;
            margin-left: 8px;
            animation: blink 1s infinite;
        }

        .status {
            color: #f1fa8c;
            font-size: 1.1rem;
            margin: 15px 0 50px 0;
        }

        section {
            border-left: 2px solid #444;
            padding-left: 20px;
            margin-bottom: 40px;
        }

        .label {
            color: #6272a4;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: block;
            margin-top: 15px;
        }

        .value {
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: block;
        }

        /* SNSリスト */
        .sns-row {
            display: flex;
            justify-content: space-between;
            max-width: 300px;
            margin: 15px 0;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .sns-name {
            color: #6272a4;
        }

        .sns-id {
            color: #fff;
        }

        /* ポップアップのスタイル */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #overlay img {
            max-width: 80%;
            max-height: 80%;
            border: 2px solid #bd93f9;
            border-radius: 12px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>About Me<span class="cursor"></span></h1>
        <div class="status">苫小牧高専 / 寮生</div>
    </header>

    <section>
        <span class="label">School</span>
        <span class="value">NIT, Tomakomai College</span>

        <span class="label">Birthday</span>
        <span class="value">2010/05/11</span>
    </section>

    <section>
        <div class="sns-row">
            <span class="sns-name">Discord</span>
            <span class="sns-id">tras_karaage</span>
        </div>

        <div class="sns-row" onclick="showQR()">
            <span class="sns-name">Line</span>
            <span class="sns-id">ID : as5382</span>
        </div>

        <div class="sns-row">
            <span class="sns-name">X</span>
            <span class="sns-id">?</span>
        </div>
    </section>

    <div id="overlay" onclick="hideQR()">
        <img src="line-qr.png" alt="Line QR Code">
    </div>

    <script>
        function showQR() {
            document.getElementById('overlay').style.display = 'flex';
        }
        function hideQR() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>

</body>

</html>
