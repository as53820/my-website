<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS53820 // System Dashboard</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --border-gold: #ffd700;
            --text-dark: #222;
            --text-gray: #555;
            --accent-gold: #ffd700;
            --panel-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            background-color: #f0f0f0;
            /* 少しグレーがかった白でパネルを際立たせる */
            color: var(--text-dark);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            display: grid;
            /* PCレイアウト */
            grid-template-columns: 1fr 300px;
            grid-template-rows: 1fr 150px;
            height: 100vh;
            gap: 8px;
            padding: 8px;
            box-sizing: border-box;
        }

        /* 左上：映像エリア */
        #viewport {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            background: #fff;
            border: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 4px;
        }

        #bg-stream {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            /* 映像自体の背景は黒 */
        }

        /* 右側：サイド情報パネル */
        .side-panel {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            background: var(--panel-bg);
            border: 1px solid var(--border-gold);
            padding: 20px;
            font-size: 0.85em;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            border-radius: 4px;
        }

        /* 下側：ボトムステータスパネル */
        .bottom-panel {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            background: var(--panel-bg);
            border: 1px solid var(--border-gold);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-radius: 4px;
        }

        .panel-title {
            color: var(--accent-gold);
            font-size: 0.75em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 4px;
        }

        .info-label {
            color: var(--text-gray);
            font-size: 0.8em;
            font-weight: bold;
        }

        .info-value {
            color: var(--text-dark);
            margin-bottom: 12px;
            font-weight: 500;
        }

        /* --------------------------------------------------
           スマホ対応 (Mobile Layout)
        -------------------------------------------------- */
        @media (max-width: 900px) {
            body {
                display: block;
                /* グリッド解除 */
                height: auto;
                overflow-y: auto;
                padding: 10px;
            }

            #viewport {
                width: 100%;
                height: 56.25vw;
                /* 16:9比率を維持 */
                margin-bottom: 10px;
            }

            .side-panel,
            .bottom-panel {
                width: 100%;
                margin-bottom: 10px;
                box-sizing: border-box;
            }

            .bottom-panel {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div id="viewport">
        <img id="bg-stream" src="http://localhost:5000/video_feed" alt="System Offline">
    </div>

    <div class="side-panel">
        <div class="panel-title">Accounts</div>
        <div class="info-label">GitHub:</div>
        <div class="info-value"><a href="https://github.com/as53820"
                style="color:var(--accent-gold); text-decoration:none;">as53820</a></div>
        <div class="info-label">Discord:</div>
        <div class="info-value">asas511</div>
        <div class="info-label">X:</div>
        <div class="info-value"><a href="#" style="color:var(--accent-gold); text-decoration:none;">@asas511</a></div>

        <div class="panel-title" style="margin-top:20px;">Lab Log</div>
        <div class="info-value">> System online.</div>
        <div class="info-value">> Streaming live feed.</div>
    </div>

    <div class="bottom-panel">
        <div>
            <div class="panel-title">Operator</div>
            <div style="font-size: 1.4em; color: var(--accent-gold); font-weight: 800;">AS53820</div>
            <div style="color: var(--text-gray); font-size: 0.8em; font-weight: bold;">Muroran // Tomakomai KOSEN
                (2026-)</div>
        </div>
        <div style="text-align: right;">
            <div class="panel-title">System Update</div>
            <div style="font-size: 0.85em; color: var(--text-dark); font-weight: 800;">
                Last Sync: 2026-03-26 22:44 JST
            </div>
        </div>
    </div>
</body>

</html>
