<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS53820 // AI Habitat</title>
    <style>
        :root {
            --bg-color: #0d0221;
            /* 暗い紫 */
            --text-color: #e0e0e0;
            --main-purple: #8a2be2;
            --neon-blue: #00ffff;
            --glass-bg: rgba(26, 16, 51, 0.6);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            /* 画面からはみ出さない */
        }

        /* メインコンテナ：ガラスモーフィズム */
        .box {
            border: 1px solid var(--main-purple);
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
            text-align: center;
            width: 90%;
            max-width: 900px;
            border-radius: 8px;
        }

        /* ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--main-purple);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .status {
            font-size: 0.8em;
            color: var(--neon-blue);
        }

        /* AI Habitat（箱庭エリア） */
        #ai-habitat {
            border: 1px solid rgba(138, 43, 226, 0.3);
            background: rgba(0, 0, 0, 0.5);
            height: 400px;
            position: relative;
            /* アバターの配置用 */
            overflow: hidden;
            margin-bottom: 20px;
            /* クォータービュー風の背景イメージ（ダミー） */
            background-image:
                linear-gradient(rgba(138, 43, 226, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138, 43, 226, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: -1px -1px;
            transform: rotateX(60deg) rotateZ(-45deg);
            /* アイソメトリック風に傾ける */
            transform-origin: center center;
        }

        /* AIアバター（ちっちゃい画像） */
        .avatar {
            width: 32px;
            height: 32px;
            position: absolute;
            bottom: 50px;
            /* 初期位置 */
            left: 50%;
            transform: translateX(-50%) rotateZ(45deg) rotateX(-60deg);
            /* 傾きを補正 */
            transition: 0.5s linear;
            /* 移動アニメーション */
            z-index: 10;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            /* 友人のサイトのように、少し光らせる */
            filter: drop-shadow(0 0 5px var(--neon-blue));
        }

        /* AIの思考（吹き出し） */
        .thought-bubble {
            position: absolute;
            background: white;
            color: black;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.8em;
            max-width: 200px;
            word-wrap: break-word;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            /* アバターの頭上に配置 */
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) rotateZ(45deg) rotateX(-60deg);
            /* 傾きを補正 */
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 11;
        }

        /* 吹き出しの尻尾 */
        .thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent;
        }

        /* スペックテキスト（下部） */
        .spec-text {
            font-size: 0.7em;
            color: rgba(224, 224, 224, 0.5);
            margin-top: 20px;
        }

        </div><script>const habitat=document.getElementById('ai-habitat');
        const avatar=document.getElementById('avatar');
        const bubble=document.getElementById('thought-bubble');
        const thoughtText=document.getElementById('thought-text');

        // 将来、バックエンド（LLM）から取得するデータのダミー
        const thoughts=[ "Tesla V100のTensorコアが熱い...",
        "Arch Linuxのアップデート、何か面白いのあるかな？",
        "物理AIプロジェクトのロボット、少し左に傾いてる気がする。",
        "苫小牧高専の制服、採寸いつだっけ？",
        "西暦2026年、今日もV100は元気に回ってる。"
        ];

        // アバターをランダムに移動させる（準備用）
        function moveAvatar() {
            const x=Math.random() * 80+10; // 10% ~ 90%
            const y=Math.random() * 80+10; // 10% ~ 90%

            avatar.style.left=`$ {
                x
            }

            %`;

            avatar.style.bottom=`$ {
                y
            }

            %`;

            // 移動後に思考を表示
            setTimeout(showThought, 1000);
        }

        // 思考（吹き出し）を表示
        function showThought() {
            const thought=thoughts[Math.floor(Math.random() * thoughts.length)];
            thoughtText.innerText=thought;
            bubble.style.opacity=1;

            // 数秒後に消す
            setTimeout(()=> {
                    bubble.style.opacity=0;
                    // 次の移動
                    setTimeout(moveAvatar, 3000);
                }

                , 5000);
        }

        // 最初の移動
        setTimeout(moveAvatar, 2000);
        </script></body></html>
